name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          PACKAGE_NAME: masjidpi-${{ github.ref_name }}
        run: |
          set -Eeuo pipefail

          rm -rf dist
          mkdir -p dist

          build_package() {
            local arch="$1"
            local goarch="$2"
            local package_dir="dist/${PACKAGE_NAME}-linux-${arch}"
            local binary="${package_dir}/masjidpi"

            mkdir -p "$package_dir"

            pushd backend >/dev/null
            GOOS=linux GOARCH="$goarch" \
              go build -trimpath \
                -ldflags "-X github.com/X-Calibre/MasjidPi/backend/internal/version.Version=${VERSION}" \
                -o "../$binary" ./cmd/masjidpi
            cp configs/default.yaml "../$package_dir/default.yaml"
            cp data/catalogue.json "../$package_dir/catalogue.json"
            popd >/dev/null

            # The HTTP server serves the release frontend from the directory
            # next to the executable. Keep the complete frontend in every
            # release package so all selected component UIs are available.
            cp -R frontend "$package_dir/frontend"

            # Include the complete installer and service definitions so a
            # downloaded release can install Listen, Board, or both without a
            # source checkout.
            mkdir -p "$package_dir/scripts"
            cp scripts/*.sh "$package_dir/scripts/"
            cp scripts/*.service "$package_dir/scripts/"

            printf '%s\n' "$VERSION" > "$package_dir/VERSION"

            test -x "$binary"
            test -f "$package_dir/default.yaml"
            test -f "$package_dir/catalogue.json"
            test -f "$package_dir/VERSION"
            test -f "$package_dir/frontend/index.html"
            test -f "$package_dir/frontend/app.js"
            test -f "$package_dir/frontend/masjidboard.html"
            test -f "$package_dir/scripts/install.sh"
            test -f "$package_dir/scripts/masjidboard-display.sh"
            test -f "$package_dir/scripts/masjidpi.service"
            test -f "$package_dir/scripts/masjidpi-display.service"

            tar -C dist -czf "dist/${PACKAGE_NAME}-linux-${arch}.tar.gz" \
              "${PACKAGE_NAME}-linux-${arch}"
          }

          # Official release targets:
          # - arm64: Raspberry Pi 3A/B, 4, 5 and Zero 2W
          # - amd64: 64-bit x86 Linux systems
          build_package arm64 arm64
          build_package amd64 amd64

          (
            cd dist
            sha256sum *.tar.gz > SHA256SUMS
          )

          echo "Release artifacts:"
          ls -lh dist/*.tar.gz dist/SHA256SUMS
          echo
          cat dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            dist/masjidpi-${VERSION}-linux-arm64.tar.gz \
            dist/masjidpi-${VERSION}-linux-amd64.tar.gz \
            dist/SHA256SUMS \
            --title "$VERSION" \
            --generate-notes
