name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Check Go formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"

      - name: Run Go vet
        working-directory: backend
        run: go vet ./...

      - name: Run Go tests with race detector
        working-directory: backend
        run: go test -race ./...

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/*.sh
          bash -n tests/*.sh
          # These files are sourced by install.sh, so their shared globals look
          # unused when ShellCheck analyses each file independently.
          shellcheck -e SC1091,SC2034 scripts/*.sh tests/*.sh

      - name: Test installer and display runtime
        run: |
          bash tests/installer_network_test.sh
          bash tests/installer_summary_test.sh
          bash tests/installer_boot_test.sh
          bash tests/masjidboard_display_profile_test.sh

      - name: Validate JavaScript syntax
        run: |
          node --check frontend/*.js
          for test_file in tests/*.js; do
            node "$test_file"
          done
