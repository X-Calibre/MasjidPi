<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasjidPi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>MasjidPi</h1>
        <p>Masjid Audio Streaming</p>
    </header>

    <section class="card">

        <h2>Player Status</h2>

        <div class="status-row">
            <span>State</span>
            <span id="state">Unknown</span>
        </div>

        <div class="status-row">
            <span>Volume</span>
            <span id="volume">0</span>
        </div>

        <label>Current Stream</label>

        <pre id="url"></pre>

    </section>

    <section class="card">

        <label>Stream URL</label>

        <input
            id="stream"
            type="text"
            placeholder="https://">

    <label for="volumeSlider">Volume</label>

        <input
            id="volumeSlider"
            type="range"
           min="0"
           max="100"
            value="100">

        <div id="volumeValue">100%</div>

        <div class="buttons">

            <button id="play">
                ▶ Play
            </button>

            <button id="stop">
                ■ Stop
            </button>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
