<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Starting MasjidBoard</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #050f0d 0%, #030505 100%);
        }

        body {
            display: grid;
            place-items: center;
        }

        .startup {
            width: min(70vw, 720px);
            height: min(70vh, 720px);
            display: grid;
            place-items: center;
        }

        .startup img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <main class="startup" aria-label="MasjidPi is starting">
        <img src="masjidpi-splash-logo.png" alt="">
    </main>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const profile = params.get("profile") === "appliance" ? "appliance" : "standard";
            const readyUrl = "http://127.0.0.1:8080/api/version";
            const target = profile === "appliance"
                ? "http://127.0.0.1:8080/masjidboard.html?profile=appliance"
                : "http://127.0.0.1:8080/masjidboard.html";
            let navigating = false;

            const tryBackend = async () => {
                if (navigating) return;

                try {
                    // This page is loaded from file:// before the HTTP server is
                    // ready. no-cors lets us use a successful local HTTP response
                    // purely as a readiness signal without reading its contents.
                    await fetch(readyUrl, {
                        method: "GET",
                        mode: "no-cors",
                        cache: "no-store"
                    });

                    navigating = true;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => window.location.replace(target));
                    });
                } catch (_) {
                    window.setTimeout(tryBackend, 500);
                }
            };

            requestAnimationFrame(() => {
                requestAnimationFrame(tryBackend);
            });
        })();
    </script>
</body>
</html>
