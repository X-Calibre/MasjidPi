<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>MasjidBoard Â· MasjidPi</title>
    <link rel="stylesheet" href="masjidboard-display.css?v=20260823-new-card-fixtures">
    <link rel="stylesheet" href="masjidboard-detailed.css?v=20260823-new-card-fixtures">
    <link rel="stylesheet" href="masjidboard-date-header.css?v=20260823-new-card-fixtures">
    <link rel="stylesheet" href="masjidboard-portrait.css?v=20260823-portrait-card-clean">
    <link rel="stylesheet" href="masjidboard-themes.css?v=20260823-new-card-fixtures">
</head>
<body data-board-theme="emerald">
<main class="board-shell" aria-live="polite">
    <header class="board-topbar">
        <div id="detailedDateBlock" class="detailed-date-block" aria-label="Current date">
            <time id="detailedGregorianDate" class="detailed-gregorian-date"></time>
            <div id="detailedIslamicDate" class="detailed-islamic-date"></div>
        </div>
        <div class="clock-block">
            <time id="currentTime" class="current-time">--:--</time>
            <time id="currentDate" class="current-date">Loading dateâ¦</time>
        </div>
        <div id="connectionState" class="connection-state" role="status">Connectingâ¦</div>
    </header>

    <aside id="detailedCommunityPanel" class="detailed-community-panel hidden" aria-label="Community notices">
        <div id="detailedCommunityCards" class="detailed-community-cards"></div>
        <div id="detailedCommunityEmpty" class="detailed-community-empty hidden">
            <strong>No current notices</strong>
            <span>Announcements and community notices will appear here.</span>
        </div>
    </aside>

    <section id="unconfiguredState" class="empty-state hidden">
        <h1>MasjidBoard is not configured</h1>
        <p>Select your locations and masjids from the MasjidPi WebUI.</p>
    </section>

    <section id="displayState" class="display-state hidden">
        <div class="landscape-layout-shell">
            <div class="timetable-stage">
                <div id="boardHeaders" class="comparison-grid board-headers"></div>
                <div id="prayerGrid" class="prayer-grid"></div>
            </div>
        </div>
    </section>

    <aside id="additionalTimes" class="additional-times" aria-label="Daily times"></aside>

    <section id="loadErrorState" class="empty-state hidden">
        <h1>Timetable temporarily unavailable</h1>
        <p>MasjidPi will keep trying automatically.</p>
    </section>

    <section id="portraitState" class="portrait-state hidden" aria-label="Portrait MasjidBoard display">
        <header class="portrait-header">
            <div class="portrait-clock-row">
                <time id="portraitClock" class="portrait-clock">--:--</time>
                <div class="portrait-information">
                    <strong id="portraitPrimaryName"></strong>
                    <time id="portraitGregorianDate"></time>
                    <div id="portraitIslamicDate"></div>
                </div>
            </div>
            <div class="portrait-next">
                <strong id="portraitNextName" class="portrait-next-name">-</strong>
                <div id="portraitCountdown" class="portrait-countdown"></div>
                <time id="portraitNextTime">--:--</time>
            </div>
        </header>
        <div id="portraitSlides" class="portrait-slides"></div>
        <footer class="portrait-footer"><div id="portraitDots" class="portrait-dots"></div></footer>
    </section>
</main>

<script src="masjidboard-theme.js?v=20260823-new-card-fixtures"></script>
<script src="masjidboard-date-utils.js?v=20260823-new-card-fixtures"></script>
<script src="masjidboard-display.js?v=20260823-new-card-fixtures"></script>
<script src="masjidboard-community-utils.js?v=20260823-portrait-card-clean"></script>
<script src="masjidboard-detailed.js?v=20260823-new-card-fixtures"></script>
<script src="masjidboard-portrait.js?v=20260823-portrait-card-clean"></script>
</body>
</html>
