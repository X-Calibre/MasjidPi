<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Set up MasjidFrame</title>
    <link rel="stylesheet" href="setup.css?v=20260905-number-row">
</head>
<body>
    <main class="setup-shell">
        <header class="setup-header">
            <div class="brand-mark" aria-hidden="true">M</div>
            <div>
                <p class="eyebrow">Welcome to</p>
                <h1>MasjidFrame</h1>
            </div>
        </header>

        <section id="networkStep" class="setup-step" aria-labelledby="networkHeading">
            <div class="step-heading">
                <div>
                    <p class="step-number">Step 1</p>
                    <h2 id="networkHeading">Connect to Wi-Fi</h2>
                    <p>Choose your 2.4 GHz Wi-Fi network.</p>
                </div>
                <button id="refreshNetworks" class="secondary-button" type="button">Refresh</button>
            </div>
            <p id="networkStatus" class="status-message" role="status">Looking for nearby networks…</p>
            <div id="networkList" class="network-list" aria-live="polite"></div>
        </section>

        <section id="passwordStep" class="setup-step" aria-labelledby="passwordHeading" hidden>
            <button id="backToNetworks" class="back-button" type="button">‹ Back</button>
            <p class="step-number">Step 1</p>
            <h2 id="passwordHeading">Enter Wi-Fi password</h2>
            <p id="selectedNetwork" class="selected-network"></p>
            <label for="wifiPassword">Password</label>
            <div class="password-row">
                <input id="wifiPassword" type="password" readonly autocomplete="off" spellcheck="false" maxlength="64" aria-describedby="passwordHelp">
                <button id="togglePassword" class="secondary-button" type="button" aria-pressed="false">Show</button>
            </div>
            <p id="passwordHelp" class="field-help">Use the keyboard below, then select Connect.</p>
            <p id="connectStatus" class="status-message error-message" role="alert"></p>
            <button id="connectButton" class="primary-button" type="button">Connect</button>
        </section>

        <section id="successStep" class="setup-step success-step" aria-labelledby="successHeading" hidden>
            <div class="success-icon" aria-hidden="true">✓</div>
            <p class="step-number">Connected</p>
            <h2 id="successHeading">MasjidFrame is online</h2>
            <p id="successNetwork"></p>
            <button id="continueButton" class="primary-button" type="button">Choose your masjid</button>
        </section>
    </main>

    <section id="keyboard" class="keyboard" aria-label="On-screen keyboard" hidden>
        <div id="keyboardRows" class="keyboard-rows"></div>
    </section>

    <script src="setup.js?v=20260905-number-row"></script>
</body>
</html>
